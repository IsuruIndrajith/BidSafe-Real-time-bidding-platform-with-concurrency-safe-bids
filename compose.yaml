services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/${APP_IMAGE_NAME:-bidsafe}:${APP_IMAGE_TAG:-latest}
    container_name: bidsafe-app
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-characters}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-bid_safe}
      DB_USERNAME: ${DB_USERNAME:-bid_app}
      DB_PASSWORD: ${DB_PASSWORD:-bid_app_password}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: bidsafe-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bid_safe}
      MYSQL_USER: ${DB_USERNAME:-bid_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bid_app_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bidsafe-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  mysql_data:
